spring.application.name=Procedures-CafeLab

# PostgreSQL exclusivo del bounded context Procedures.
# DB_URL es la URL JDBC completa del proyecto/base destino (ver .env.example).
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://postgres:5432/procedures_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:cafelabpassword123}}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:${SERVER_PORT:8083}}

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.acme.procedurescafelab.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761}/eureka
eureka.instance.instance-id=${WEBSITE_HOSTNAME:localhost}:${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${WEBSITE_HOSTNAME:localhost}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.non-secure-port=${PORT:${SERVER_PORT:8083}}

# Flyway
spring.flyway.enabled=false
